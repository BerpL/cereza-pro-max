spring.application.name=cereza-pro-max
server.port=8080

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cereza_pro_max?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# sesion solo por cookie, sin jsessionid en la URL
server.servlet.session.tracking-modes=cookie
