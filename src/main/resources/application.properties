spring.application.name=cereza-pro-max
server.port=8080

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cereza_pro_max?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# Al arrancar crea la base si no existe y ejecuta schema.sql y data.sql (tablas + datos de prueba)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# sesion solo por cookie, sin jsessionid en la URL
server.servlet.session.tracking-modes=cookie
