<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cereza Pro Max - categorías de atención</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{layout :: cabecera}"></header>
<main>
	<h1>Mantenimiento de categorías de atención</h1>
	<a class="btn" th:href="@{/categorias/nuevo}">Nuevo registro</a>
	<br><br>
	<div class="card">
		<table>
			<tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
			<tr th:each="x : ${categorias}">
				<td th:text="${x.idCategoria}"></td><td th:text="${x.nombre}"></td><td th:text="${x.descripcion}"></td>
				<td><span th:classappend="${x.estado == 'ACTIVO'} ? 'tag' : 'tag off'" th:text="${x.estado}"></span></td>
				<td>
					<a th:href="@{/categorias/editar/{id}(id=${x.idCategoria})}">Editar</a> ·
					<a th:href="@{/categorias/estado/{id}(id=${x.idCategoria})}">Cambiar estado</a>
				</td>
			</tr>
		</table>
	</div>
</main>
</body>
</html>
