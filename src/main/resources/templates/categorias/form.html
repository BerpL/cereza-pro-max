<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cereza Pro Max - Categoría</title><link rel="stylesheet" th:href="@{/css/app.css(v=10)}"></head>
<body th:replace="~{layout :: shell('categorias', ${ {{'Mantenimientos', null}, {'Categorías', '/categorias'}, {categoria.idCategoria == null ? 'Nueva categoría' : 'Editar categoría', null}} })}">
<main id="page">
	<a class="btn ghost" th:href="@{/categorias}"><svg th:replace="~{layout :: ic('back')}"></svg>Volver a categorías</a>
	<div class="page-head"><div><h1 th:text="${categoria.idCategoria == null} ? 'Registrar categoría' : 'Editar categoría'"></h1><p>Tipo de solicitud que atiende el contact center</p></div></div>
	<form class="card" th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" style="max-width:820px">
		<h2>Datos de la categoría</h2>
		<input type="hidden" th:field="*{idCategoria}"><input type="hidden" th:field="*{estado}">
		<div class="grid">
			<div><label>Nombre *</label><input th:field="*{nombre}" placeholder="Ej. Reclamo"><p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p></div>
			<div><label>Descripción</label><input th:field="*{descripcion}" placeholder="Breve descripción"></div>
		</div>
		<div class="actions"><button class="btn" type="submit"><svg th:replace="~{layout :: ic('check')}"></svg>Guardar</button><a class="btn sec" th:href="@{/categorias}">Cancelar</a></div>
	</form>
</main>
</body>
</html>
