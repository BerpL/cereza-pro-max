<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cereza Pro Max - Registrar atención</title><link rel="stylesheet" th:href="@{/css/app.css(v=2)}"></head>
<body th:replace="~{layout :: shell('registro', ${ {{'Operación', null}, {'Registrar atención', null}} })}">
<main id="page">
	<div class="page-head"><div><h1>Registrar atención</h1><p>La atención y sus mensajes se guardan en una sola transacción</p></div></div>
	<form th:action="@{/atenciones/registrar}" method="post" style="max-width:860px">
		<div class="card"><h2>1. Datos de la atención</h2>
			<div class="grid">
				<div><label>Cliente *</label><select name="idCliente" required><option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre + ' (' + c.telefono + ')'}"></option></select></div>
				<div><label>Agente *</label><select name="idAgente" required><option th:each="a : ${agentes}" th:value="${a.idAgente}" th:text="${a.nombre}"></option></select></div>
				<div><label>Categoría de atención *</label><select name="idCategoria" required><option th:each="k : ${categorias}" th:value="${k.idCategoria}" th:text="${k.nombre}"></option></select></div>
				<div><label>Campaña</label><select name="idCampana"><option value="">-- Sin campaña --</option><option th:each="k : ${campanas}" th:value="${k.idCampana}" th:text="${k.nombre}"></option></select><small class="hint">Opcional, para envíos masivos</small></div>
			</div>
		</div>
		<div class="card"><h2>2. Mensajes a enviar</h2>
			<div class="grid">
				<div class="full"><label>Mensaje 1 *</label><input name="mensajes" required placeholder="Texto que recibirá el cliente"></div>
				<div class="full"><label>Mensaje 2</label><input name="mensajes" placeholder="Opcional"></div>
				<div class="full"><label>Mensaje 3</label><input name="mensajes" placeholder="Opcional"></div>
			</div>
			<small class="hint">Si un mensaje ya fue enviado a este cliente, el sistema lo marcará como DUPLICADO y no lo reenviará.</small>
			<div class="actions"><button class="btn" type="submit"><svg th:replace="~{layout :: ic('send')}"></svg>Registrar y enviar</button><a class="btn sec" th:href="@{/}">Cancelar</a></div>
		</div>
	</form>
</main>
</body>
</html>
