<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cereza Pro Max</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="cabecera">
	<div><strong>Cereza Pro Max</strong> · Contact Center WhatsApp</div>
	<nav>
		<a th:href="@{/}">Panel</a>
		<a th:href="@{/clientes}" th:if="${session.rol == 'ADMINISTRADOR'}">Clientes</a>
		<a th:href="@{/agentes}" th:if="${session.rol == 'ADMINISTRADOR'}">Agentes</a>
		<a th:href="@{/categorias}" th:if="${session.rol == 'ADMINISTRADOR'}">Categorías</a>
		<a th:href="@{/consultas/atenciones}" th:if="${session.rol != 'AGENTE'}">Consultas</a>
		<a th:href="@{/reportes/atenciones-por-agente}" th:if="${session.rol != 'AGENTE'}">Reportes</a>
		<a th:href="@{/atenciones/registro}" th:if="${session.rol != 'SUPERVISOR'}">Registrar atención</a>
		<a th:href="@{/logout}" th:text="'Salir (' + ${session.usuario.nombre} + ')'">Salir</a>
	</nav>
</header>
</body>
</html>
