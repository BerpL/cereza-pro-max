<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cereza Pro Max - Reporte de atenciones por agente</title><link rel="stylesheet" th:href="@{/css/app.css(v=10)}"></head>
<body th:replace="~{layout :: shell('r-agente', ${ {{'Reportes', null}, {'Atenciones por agente', null}} })}">
<main id="page">
	<div class="page-head"><div><h1>Atenciones por agente</h1><p>Productividad del equipo en un rango de fechas</p></div><button class="btn sec" type="button" onclick="window.print()"><svg th:replace="~{layout :: ic('print')}"></svg>Imprimir / PDF</button></div>
	<form class="card" th:action="@{/reportes/atenciones-por-agente}" method="get">
		<div class="filters">
			<div><label>Desde</label><input type="date" name="desde" th:value="${desde}" required></div>
			<div><label>Hasta</label><input type="date" name="hasta" th:value="${hasta}" required></div>
			<div class="go"><button class="btn" type="submit"><svg th:replace="~{layout :: ic('chart')}"></svg>Generar</button></div>
		</div>
	</form>
	<div class="card">
		<h2>Periodo del <span th:text="${#temporals.format(desde, 'dd/MM/yyyy')}"></span> al <span th:text="${#temporals.format(hasta, 'dd/MM/yyyy')}"></span></h2>
		<table th:if="${!#lists.isEmpty(filas)}"><thead><tr><th>Agente</th><th>Total</th><th>Atendidas</th><th>Pendientes / en curso</th><th style="width:35%">Avance</th></tr></thead>
		<tbody><tr th:each="f : ${filas}">
			<td><b th:text="${f[0]}"></b></td><td th:text="${f[1]}"></td><td th:text="${f[2]}"></td><td th:text="${f[1] - f[2]}"></td>
			<td><div class="bar-wrap"><div class="bar" th:style="'width:' + (${f[1]} > 0 ? ${f[2]} * 100 / ${f[1]} : 0) + '%'"></div></div></td>
		</tr></tbody></table>
		<div class="empty" th:if="${#lists.isEmpty(filas)}"><svg th:replace="~{layout :: ic('chart')}"></svg><div>No hay atenciones en el periodo.</div></div>
	</div>
</main>
</body>
</html>
