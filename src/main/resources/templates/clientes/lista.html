<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cereza Pro Max - Clientes</title><link rel="stylesheet" th:href="@{/css/app.css(v=7)}"></head>
<body th:replace="~{layout :: shell('clientes', ${ {{'Mantenimientos', null}, {'Clientes', null}} })}">
<main id="page">
	<div class="page-head"><div><h1>Clientes</h1><p>Personas y empresas que se atienden por WhatsApp</p></div><a class="btn" th:href="@{/clientes/nuevo}"><svg th:replace="~{layout :: ic('plus')}"></svg>Nuevo registro</a></div>
	<div class="card">
		<h2 class="with-legend">Registros <span class="n" th:text="${#lists.size(clientes)}">0</span><span class="sem-legend"><span><i class="sem-ok"></i>Activo</span><span><i class="sem-off"></i>Inactivo</span></span></h2>
		<table><thead><tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Acciones</th></tr></thead>
		<tbody><tr th:each="x : ${clientes}" th:classappend="${x.estado == 'ACTIVO'} ? 'r-ok' : 'r-off'">
			<td class="num" th:text="${x.idCliente}"></td><td><b th:text="${x.nombre}"></b></td><td th:text="${x.telefono}"></td><td th:text="${x.correo}"></td>
			<td><div class="row-actions">
				<a th:href="@{/clientes/editar/{id}(id=${x.idCliente})}"><svg th:replace="~{layout :: ic('edit')}"></svg>Editar</a>
				<a th:href="@{/clientes/estado/{id}(id=${x.idCliente})}"><svg th:replace="~{layout :: ic('toggle')}"></svg><span th:text="${x.estado == 'ACTIVO'} ? 'Desactivar' : 'Activar'"></span></a>
			</div></td>
		</tr></tbody></table>
		<div class="empty" th:if="${#lists.isEmpty(clientes)}"><svg th:replace="~{layout :: ic('inbox')}"></svg><div>No hay registros todavía.</div></div>
	</div>
</main>
</body>
</html>
