<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Cereza Pro Max - Agente</title><link rel="stylesheet" th:href="@{/css/app.css(v=7)}"></head>
<body th:replace="~{layout :: shell('agentes', ${ {{'Mantenimientos', null}, {'Agentes', '/agentes'}, {agente.idAgente == null ? 'Nuevo agente' : 'Editar agente', null}} })}">
<main id="page">
	<a class="btn ghost" th:href="@{/agentes}"><svg th:replace="~{layout :: ic('back')}"></svg>Volver a agentes</a>
	<div class="page-head"><div><h1 th:text="${agente.idAgente == null} ? 'Registrar agente' : 'Editar agente'"></h1><p>Personal que atiende las solicitudes</p></div></div>
	<form class="card" th:action="@{/agentes/guardar}" th:object="${agente}" method="post" style="max-width:820px">
		<h2>Datos del agente</h2>
		<input type="hidden" th:field="*{idAgente}"><input type="hidden" th:field="*{estado}">
		<div class="grid">
			<div><label>Nombre *</label><input th:field="*{nombre}" placeholder="Nombre y apellido"><p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p></div>
			<div><label>Turno</label><select th:field="*{turno}"><option value="MANANA">Mañana</option><option value="TARDE">Tarde</option><option value="NOCHE">Noche</option></select></div>
		</div>
		<div class="actions"><button class="btn" type="submit"><svg th:replace="~{layout :: ic('check')}"></svg>Guardar</button><a class="btn sec" th:href="@{/agentes}">Cancelar</a></div>
	</form>
</main>
</body>
</html>
